name: Build and Upload iOS App

on:
  workflow_dispatch:

env:
  APP_VERSION: '1.5'

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets and Capacitor iOS Project
        run: |
          if [ ! -d "www" ]; then
            mkdir -p www
            rsync -av --progress . www/ \
              --exclude .git \
              --exclude .github \
              --exclude node_modules \
              --exclude www \
              --exclude ios \
              --exclude android
          fi

          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.statlab.weather",
            "appName": "STATLAB",
            "webDir": "www"
          }
          EOF

          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

          ICON_SRC=$(find www -maxdepth 2 \( -name "icon*.png" -o -name "logo*.png" -o -name "app-icon*.png" \) | head -n 1)
          if [ -n "$ICON_SRC" ]; then
            sips -z 1024 1024 "$ICON_SRC" --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png || true
          fi

          INFO_PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string '현재 위치 기반 산악 기상 예보 및 등산 경로 안내를 위해 위치 정보가 필요합니다.'" "$INFO_PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription '현재 위치 기반 산악 기상 예보 및 등산 경로 안내를 위해 위치 정보가 필요합니다.'" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$INFO_PLIST"

      - name: Install Apple Certificate and Provisioning Profile
        env:
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_PROVISION_BASE64: ${{ secrets.APPLE_PROVISION_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="statlab_temp_keychain"

          echo -n "$APPLE_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$APPLE_PROVISION_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/pp.plist"
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/pp.plist")
          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID".mobileprovision

      - name: Build and Export IPA
        run: |
          cat << 'EOF' > set_signing.rb
          pbx = File.read("ios/App/App.xcodeproj/project.pbxproj")
          uuid = ENV["PP_UUID"]
          app_ver = ENV["APP_VERSION"] || "1.1"
          build_num = ENV["GITHUB_RUN_NUMBER"] || "2"
          pbx.gsub!(/ProvisioningStyle = Automatic;/, "ProvisioningStyle = Manual;")
          pbx.gsub!(/DEVELOPMENT_TEAM = [^;]*;/, "")
          pbx.gsub!(/CODE_SIGN_IDENTITY = [^;]*;/, "")
          pbx.gsub!(/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/, "")
          pbx.gsub!(/MARKETING_VERSION = [^;]*;/, "MARKETING_VERSION = #{app_ver};")
          pbx.gsub!(/CURRENT_PROJECT_VERSION = [^;]*;/, "CURRENT_PROJECT_VERSION = #{build_num};")
          replacement = [
            "CODE_SIGN_STYLE = Manual;",
            "CODE_SIGN_IDENTITY = \"Apple Distribution\";",
            "DEVELOPMENT_TEAM = WPV54CTPYA;",
            "PROVISIONING_PROFILE_SPECIFIER = \"#{uuid}\";"
          ].join("\n\t\t\t\t")
          pbx.gsub!(/CODE_SIGN_STYLE = Automatic;/, replacement)
          File.write("ios/App/App.xcodeproj/project.pbxproj", pbx)
          EOF
          ruby set_signing.rb

          if [ -d "ios/App/App.xcworkspace" ]; then
            BUILD_TARGET="-workspace ios/App/App.xcworkspace"
          else
            BUILD_TARGET="-project ios/App/App.xcodeproj"
          fi

          xcodebuild $BUILD_TARGET \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -archivePath "$RUNNER_TEMP/STATLAB.xcarchive" \
            archive

          cat << EOF > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>WPV54CTPYA</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.statlab.weather</key>
              <string>$PP_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/STATLAB.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA to App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

          IPA_FILE=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA_FILE" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"
